<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irrigation Sizer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
</head>
<body>
  <header>
    <h1>Irrigation Sizer</h1>
    <nav class="mode-tabs" aria-label="Modalità operativa">
      <button class="mode-tab active" data-mode="verifica" aria-pressed="true">Verifica</button>
      <button class="mode-tab" data-mode="taratura" aria-pressed="false">Taratura</button>
    </nav>
    <button id="theme-toggle" aria-label="Cambia tema chiaro/scuro">🌓</button>
    <button id="settings-toggle" aria-label="Impostazioni">⚙️</button>
  </header>

  <main>
    <section id="slider">
      <label for="time-slider">Tempo di accensione: <span id="time-value">0</span> min</label>
      <input type="range" id="time-slider" min="0" max="60" step="1" value="0">
    </section>

    <section id="pot-list">
      <button id="add-pot" type="button">Aggiungi vaso</button>
      <!-- Dynamic pot cards will be inserted here -->
    </section>

    <section id="totals">
      <p><span id="totals-label">Totale acqua erogata</span>: <span id="total-liters">0.00</span> l</p>
    </section>
  </main>

  <!-- Settings panel (separate from main functionality) -->
  <div id="settings-panel" class="settings-panel" hidden>
    <div class="settings-panel__content">
      <div class="settings-panel__header">
        <h2>Impostazioni</h2>
        <button id="close-settings" type="button" aria-label="Chiudi impostazioni">✕</button>
      </div>
      <div class="setting-row">
        <label for="drop-factor">Fattore di conversione (gocce/ml):</label>
        <input type="number" id="drop-factor" min="1" max="100" step="1" value="20">
      </div>
      <div class="setting-actions">
        <button id="export-btn" type="button">Esporta configurazione</button>
        <label for="import-file" class="import-label">Importa configurazione</label>
        <input type="file" id="import-file" accept=".json" hidden>
        <button id="reset-btn" type="button">Reset configurazione</button>
      </div>
    </div>
  </div>

  <footer>
    <p>Irrigation Sizer — Gestione irrigazione a goccia</p>
    <span id="app-version"></span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
